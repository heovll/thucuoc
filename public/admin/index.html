<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị thu cước</title>
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Đăng nhập -->
  <div id="login" class="login-wrap hidden">
    <form id="loginForm" class="card login-box">
      <img src="/shared/icon.svg" alt="" class="logo">
      <h1>Quản trị thu cước</h1>
      <p class="muted small">Đăng nhập bằng tài khoản quản trị.</p>
      <div class="field"><label for="lu">Tên đăng nhập</label><input id="lu" name="username" autocomplete="username" required></div>
      <div class="field"><label for="lp">Mật khẩu</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="alert error hidden"></div>
      <button class="btn-primary" style="width:100%">Đăng nhập</button>
    </form>
  </div>

  <!-- Khung chính -->
  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand"><img src="/shared/icon.svg" alt=""><span>Thu cước</span></div>
      <nav id="nav">
        <a href="#tong-quan" data-view="tong-quan">Tổng quan</a>
        <a href="#thue-bao" data-view="thue-bao">Thuê bao</a>
        <a href="#ky-cuoc" data-view="ky-cuoc">Kỳ thu cước</a>
        <a href="#nhap-du-lieu" data-view="nhap-du-lieu">Nhập dữ liệu</a>
        <a href="#lich-thong-bao" data-view="lich-thong-bao">Lịch thông báo</a>
        <a href="#duyet" data-view="duyet">Duyệt đăng ký <span id="regBadge" class="badge danger hidden"></span></a>
        <a href="#ctv" data-view="ctv">Tài khoản CTV</a>
        <a href="#dang-nhap" data-view="dang-nhap">Nhật ký đăng nhập</a>
        <a href="#cai-dat" data-view="cai-dat">Cài đặt</a>
      </nav>
      <div class="side-foot">
        <div id="meName" class="small"></div>
        <a href="/app/" class="small">Mở app nhân viên ↗</a>
        <button id="logout" class="btn-sm">Đăng xuất</button>
      </div>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <script src="/shared/datefield.js"></script>
  <script src="admin.js"></script>
</body>
</html>
